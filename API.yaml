  /api/orders/{token}/pay/:
    post:
      operationId: api_orders_pay_create
      description: |-
        Starts (or resumes) a payment attempt against the chosen gateway for the order identified by `token`, and returns a URL to send the browser to. The only thing the frontend sends is the gateway the user picked (`gateway_id`).

        The frontend must perform a full-page redirect (`window.location.href = redirect_url`), not a client-side route change - the user is leaving the app for the gateway's own site.

        **Notes:**
        - Safe to call more than once: if a PENDING transaction already exists for this order, the same `redirect_url` is returned rather than creating a second payment session (also enforced at the DB level via a partial unique constraint on `PaymentTransaction`).
        - Because payment is scoped to a specific order token (not a single "current order"), a user may have several different orders open for payment in different tabs at the same time.
        - The `callback_url` sent to the gateway always points to the backend's own callback endpoint - the gateway never talks to the frontend directly.
      summary: Start or resume a payment attempt for an order
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePayment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePayment'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Redirect URL to the payment gateway.
        '400':
          description: Invalid/inactive gateway (`gateway_id`), or order no longer
            payable.
        '404':
          description: No such order for this user.
        '401':
          description: No authenticated user.
  /api/payments/callback/{gateway_origin}/:
    get:
      operationId: api_payments_callback_retrieve
      description: |-
        Public endpoint (no auth) the gateway redirects the buyer's browser to after they complete or cancel payment (e.g. Zarinpal calling back with `?Authority=...&Status=OK`). There is no session/JWT on this request - the browser arrives here straight from the gateway's domain - so this view must not assume an authenticated user exists.

        The transaction is looked up by `Authority` (the identifier the gateway itself hands back). All business logic lives in `services.handle_payment_callback()`, which is idempotent (safe to run twice for the same Authority) since gateways occasionally fire the callback more than once and users sometimes refresh the landing page mid-flow.

        This view never returns JSON: it performs an HTTP redirect straight to the frontend's order-result page, addressed by the order's own token (a random, unguessable UUID - not a secret, ownership is re-checked by every authenticated endpoint the frontend calls next). The frontend re-fetches the real status from `GET /api/orders/{token}/` rather than trusting the `status` query string on this redirect, which is attacker-controllable.
      summary: Payment gateway return callback
      parameters:
      - in: query
        name: Authority
        schema:
          type: string
      - in: query
        name: Status
        schema:
          type: string
      - in: path
        name: gateway_origin
        schema:
          type: string
        description: Identifier of the originating gateway (e.g. zarinpal).
        required: true
      tags:
      - Payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: 'Redirect to the frontend result page: `{FRONTEND_BASE_URL}/orders/{token}/result?status=success|failed`,
            or, if the Authority could not be matched to any transaction: `{FRONTEND_BASE_URL}/orders/result?status=error`.'
    post:
      operationId: api_payments_callback_create
      description: |-
        Public endpoint (no auth) the gateway redirects the buyer's browser to after they complete or cancel payment (e.g. Zarinpal calling back with `?Authority=...&Status=OK`). There is no session/JWT on this request - the browser arrives here straight from the gateway's domain - so this view must not assume an authenticated user exists.

        The transaction is looked up by `Authority` (the identifier the gateway itself hands back). All business logic lives in `services.handle_payment_callback()`, which is idempotent (safe to run twice for the same Authority) since gateways occasionally fire the callback more than once and users sometimes refresh the landing page mid-flow.

        This view never returns JSON: it performs an HTTP redirect straight to the frontend's order-result page, addressed by the order's own token (a random, unguessable UUID - not a secret, ownership is re-checked by every authenticated endpoint the frontend calls next). The frontend re-fetches the real status from `GET /api/orders/{token}/` rather than trusting the `status` query string on this redirect, which is attacker-controllable.
      summary: Payment gateway return callback
      parameters:
      - in: query
        name: Authority
        schema:
          type: string
      - in: query
        name: Status
        schema:
          type: string
      - in: path
        name: gateway_origin
        schema:
          type: string
        description: Identifier of the originating gateway (e.g. zarinpal).
        required: true
      tags:
      - Payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: 'Redirect to the frontend result page: `{FRONTEND_BASE_URL}/orders/{token}/result?status=success|failed`,
            or, if the Authority could not be matched to any transaction: `{FRONTEND_BASE_URL}/orders/result?status=error`.'
  /api/products/:
    get:
      operationId: api_products_list
      description: |-
        Return a paginated list of active products (status='active').

        Searchable by title/slug/short description (`search`) and filterable
        by category, collection, featured status, and stock availability
        (`in_stock`). See the `ordering` parameter for sorting options and how
        out-of-stock products are always placed at the end.
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category slug
      - in: query
        name: collections
        schema:
          type: array
          items:
            type: string
        description: ممکن است چندین مقدار با کاما از هم جدا شوند.
        explode: false
        style: form
      - in: query
        name: featured
        schema:
          type: boolean
        description: Featured products
      - in: query
        name: in_stock
        schema:
          type: boolean
        description: Filter by stock availability. `true` returns only products with
          at least one active variant whose stock is greater than 0. `false` returns
          only products with no such variant.
      - in: query
        name: ordering
        schema:
          type: string
        description: |-
          Order results by one of the following fields (prefix with `-` for descending order, e.g. `-price`):

          - `created_at` — product creation date
          - `published_at` — product publish date (default ordering)
          - `title` — product title (alphabetical)
          - `price` — lowest price among the product's **active** variants. Price is not stored on the product itself but on each variant, so this orders by `MIN(price)` across the product's active variants.

          Regardless of which field/direction you choose (and regardless of any other filter applied, e.g. `in_stock`), products with **no in-stock active variant** always sort after every product that has one — consistently across pages, not just within a single page. A `-id` tie-breaker is also applied automatically so pagination stays stable even when many products tie on the chosen field.

          Example: `?ordering=-price` or `?ordering=created_at,-title`
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Products
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
