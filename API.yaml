openapi: 3.0.3
info:
  title: PEN API
  version: 1.0.0
  description: Backend API powering online stores.
paths:
  /api/audios/:
    get:
      operationId: api_audios_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Audios
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAudioList'
          description: ''
  /api/audios/{id}/next/:
    get:
      operationId: api_audios_next_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Audios
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/audios/{id}/previous/:
    get:
      operationId: api_audios_previous_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Audios
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/audios/random/:
    get:
      operationId: api_audios_random_retrieve
      tags:
      - Audios
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/addresses/:
    get:
      operationId: api_auth_addresses_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Addresses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: api_auth_addresses_create
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressWrite'
          description: ''
  /api/auth/addresses/{id}/:
    get:
      operationId: api_auth_addresses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this آدرس.
        required: true
      tags:
      - Addresses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    put:
      operationId: api_auth_addresses_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this آدرس.
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressWrite'
          description: ''
    patch:
      operationId: api_auth_addresses_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this آدرس.
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressWrite'
          description: ''
    delete:
      operationId: api_auth_addresses_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this آدرس.
        required: true
      tags:
      - Addresses
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/cities/:
    get:
      operationId: api_auth_cities_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Provinces and Cities
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCityList'
          description: ''
  /api/auth/csrf/:
    get:
      operationId: api_auth_csrf_retrieve
      description: Ensures the csrftoken cookie is set on the client. Call once on
        app load.
      summary: Set CSRF cookie
      tags:
      - Auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: |-
        Send a one-time password (OTP) to the specified phone number.

        The OTP is required to complete authentication using the `/auth/verify/` endpoint.

        Rate limited per phone number and per IP address.
      summary: Request login OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              RequestExample:
                value:
                  phone: '9123456789'
                summary: Request OTP
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: Invalidate the current session and log out the authenticated user.
      summary: Logout current user
      tags:
      - Auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Logout successful.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentication required.
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      description: Retrieve the profile of the currently authenticated user.
      summary: Current authenticated user
      tags:
      - Auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Authenticated user profile.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentication required.
    patch:
      operationId: api_auth_me_partial_update
      description: 'Update authenticated user''s profile. Supported fields: full_name
        and avatar.'
      summary: Update current user profile
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Updated user profile.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid data.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentication required.
  /api/auth/provinces/:
    get:
      operationId: api_auth_provinces_list
      tags:
      - Provinces and Cities
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Province'
          description: ''
  /api/auth/provinces/{province_id}/cities/:
    get:
      operationId: api_auth_provinces_cities_list
      parameters:
      - in: path
        name: province_id
        schema:
          type: integer
        required: true
      tags:
      - Provinces and Cities
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
          description: ''
  /api/auth/resend/:
    post:
      operationId: api_auth_resend_create
      description: |-
        Resend the one-time password (OTP) to the specified phone number.

        Subject to a stricter rate limit than the initial OTP request endpoint to prevent SMS abuse.
      summary: Resend login OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              RequestExample:
                value:
                  phone: '9123456789'
                summary: Resend OTP
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/verify/:
    post:
      operationId: api_auth_verify_create
      description: |-
        Verify the one-time password (OTP).

        Optionally provide `full_name`. It is applied only when the user is new or does not have a name yet. Existing names are not changed here.
      summary: Verify otp
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
            examples:
              RequestExampleWithName:
                value:
                  phone: '9123456789'
                  code: 123456
                  full_name: علی رضایی
                summary: Verify OTP with name
              RequestExampleWithoutName:
                value:
                  phone: '9123456789'
                  code: 123456
                summary: Verify OTP
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/blog/posts/:
    get:
      operationId: api_blog_posts_list
      parameters:
      - in: query
        name: allow_comments
        schema:
          type: boolean
      - in: query
        name: author
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: featured
        schema:
          type: boolean
      - in: query
        name: min_views
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: period
        schema:
          type: string
          enum:
          - month
          - today
          - week
          - year
        description: |-
          * `today` - Today
          * `week` - This week
          * `month` - This month
          * `year` - This year
      - in: query
        name: published_after
        schema:
          type: string
          format: date-time
      - in: query
        name: published_before
        schema:
          type: string
          format: date-time
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Posts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPostListList'
          description: ''
  /api/blog/posts/{slug}/:
    get:
      operationId: api_blog_posts_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          title: اسلاگ
        required: true
      tags:
      - Posts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
  /api/cart/:
    get:
      operationId: api_cart_retrieve
      description: Returns current cart for guest or authenticated user. For guest
        users, a cart_token cookie will be created automatically.
      summary: Get current cart
      tags:
      - Carts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cart/items/:
    post:
      operationId: api_cart_items_create
      description: Adds a product variant to the current cart. The item is identified
        by SKU. If the variant already exists in the cart, quantity will be increased.
      summary: Add item to cart
      tags:
      - Carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddCartItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddCartItem'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: Cart updated successfully.
        '400':
          description: Invalid quantity or insufficient stock.
        '404':
          description: Product variant not found.
  /api/cart/items/{sku}/:
    patch:
      operationId: api_cart_items_partial_update
      description: Updates quantity of an existing cart item. SKU is used to identify
        the product variant.
      summary: Update cart item quantity
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        description: Product variant SKU
        required: true
      tags:
      - Carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItem'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: Cart updated successfully.
        '404':
          description: Cart item not found.
    delete:
      operationId: api_cart_items_destroy
      description: Removes a product variant completely from the current cart.
      summary: Remove item from cart
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        description: Product variant SKU
        required: true
      tags:
      - Carts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: Cart updated successfully.
        '404':
          description: Cart item not found.
  /api/categories/:
    get:
      operationId: api_categories_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Categories
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryListList'
          description: ''
  /api/categories/{slug}/:
    get:
      operationId: api_categories_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          title: اسلاگ
        required: true
      tags:
      - Categories
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetail'
          description: ''
  /api/checkout/gateways/:
    get:
      operationId: api_checkout_gateways_retrieve
      description: Lists currently active payment gateways (`is_active=True`), ordered
        by priority (model default ordering), for the "choose a payment method" step
        of checkout. `credentials` is never serialized - only id/title/badge/description/min_amount/max_amount
        reach the frontend.
      summary: List active payment gateways
      tags:
      - Checkout
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gateway'
          description: ''
        '401':
          description: No authenticated user.
  /api/collections/:
    get:
      operationId: api_collections_list
      description: ViewSet for reading Collection objects.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Collections
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionListList'
          description: ''
  /api/collections/{slug}/:
    get:
      operationId: api_collections_retrieve
      description: ViewSet for reading Collection objects.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          title: اسلاگ
        required: true
      tags:
      - Collections
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
          description: ''
  /api/gallery/customers/:
    get:
      operationId: api_gallery_customers_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Gallery
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerGalleryList'
          description: ''
  /api/gallery/customers/{id}/:
    get:
      operationId: api_gallery_customers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this گالری مشتری.
        required: true
      tags:
      - Gallery
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGallery'
          description: ''
  /api/orders/:
    get:
      operationId: api_orders_retrieve
      description: Returns a paginated list of every order the authenticated user
        has ever placed, most recent first. Supports filtering by `status` (any value
        of Order.Status, e.g. `pending_payment`, `paid`, `cancelled`, `expired`, `refunded`,
        `processing`).
      summary: List my orders
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Number of orders per page. Maximum: 100.'
      - in: query
        name: status
        schema:
          type: string
        description: Filter orders by status.
      tags:
      - Orders
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_orders_create
      description: |-
        Converts the authenticated user's active Cart into a new Order. This is the step the checkout page calls right after the user confirms their shipping address, and before they pick a payment gateway.

        Not tied to any "current order" state: calling this again later (after adding new items to the cart) simply creates another, independent order - a customer can have many orders over time, and several PENDING_PAYMENT ones at once.
      summary: Create an order from the active cart
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOrder'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Order created successfully.
        '400':
          description: Address validation error (`address_id`), or a business-logic
            error (`detail`) such as an empty cart or an out-of-stock item.
        '401':
          description: No authenticated user.
  /api/orders/{token}/:
    get:
      operationId: api_orders_retrieve_2
      description: Returns full detail for one order, identified by its public `token`.
        Must belong to the caller.
      summary: Retrieve a specific order
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '404':
          description: No such order for this user.
  /api/orders/{token}/address/:
    patch:
      operationId: api_orders_address_partial_update
      description: Updates the address of an order that is still `pending_payment`
        (and not expired). Any PENDING payment attempt on this order is invalidated
        - the gateway session it points to was created for the old address/total and
        can no longer be trusted, so the frontend must call `pay/` again after this
        to start a fresh one.
      summary: Change a pending order's shipping address
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderAddressUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderAddressUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderAddressUpdate'
      security:
      - cookieAuth: []
