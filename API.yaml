          description: Invalid address, or order is no longer editable.
        '404':
          description: No such order for this user.
  /api/orders/{token}/cancel/:
    post:
      operationId: api_orders_cancel_create
      description: Cancels an order that is still `pending_payment` and releases its
        reserved stock. Orders that are already paid, expired, cancelled, or refunded
        cannot be cancelled through this endpoint.
      summary: Cancel a pending order
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          description: Order is not in a cancellable state.
        '404':
          description: No such order for this user.
  /api/orders/{token}/items/:
    post:
      operationId: api_orders_items_create
      description: Adds a new line item (by variant SKU) to an order that is still
        `pending_payment`. Reserves stock for it and recalculates order totals. Fails
        if the item is already on the order (use the update endpoint to change its
        quantity instead) or if stock is insufficient. Invalidates any PENDING payment
        attempt, same as address changes.
      summary: Add an item to a pending order
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddOrderItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddOrderItem'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          description: Item already on the order, out of stock, or order no longer
            editable.
        '404':
          description: No such order for this user, or no such SKU.
  /api/orders/{token}/items/{item_id}/:
    patch:
      operationId: api_orders_items_partial_update
      description: PATCH changes the quantity of an existing line item. DELETE removes
        it entirely (refused if it is the last remaining item - cancel the order instead).
        Both are only allowed while the order is `pending_payment`, adjust reserved
        stock and totals accordingly, and invalidate any PENDING payment attempt.
      summary: Update or remove a line item on a pending order
      parameters:
      - in: path
        name: item_id
        schema:
